<!DOCTYPE html>
<html>
<head>
  <title>Aking Unang JavaScript</title>
</head>
<body>
  <h1>JavaScript Demo</h1>

  <script>
    // 1. Maglagay ng variables
    let dogName = "Cuyos";
    let dogAge = 4;
    let humanYears = dogAge * 7;

    // 2. Pumili ng random na numero (1 hanggang 3)
    let randomToy = Math.floor(Math.random() * 3) + 1;

    // 3. I-print ang resulta sa console
    console.log("Pangalan ng Aso: " + dogName);
    console.log("Edad sa Human Years: " + humanYears);
    console.log("Napiling Laruan #: " + randomToy);
  </script>
</body>
</html>
