<!DOCTYPE html>
<html>
<head>
    <title>Cuyos Dog Information</title>
</head>

<body>

    <h1>🐶 Dog Information</h1>

    <button onclick="showDogInfo()">Show Information</button>

    <p id="result"></p>

    <script>
        function showDogInfo() {

            // Dog information
            let dogName = "Cuyos";
            let dogAge = 4;

            // Calculate human age
            let humanYears = dogAge * 7;

            // Choose a random toy from 1 to 3
            let randomToy = Math.floor(Math.random() * 3) + 1;

            // Display the information
            document.getElementById("result").innerHTML =
                "🐕 Dog's Name: " + dogName + "<br>" +
                "🎂 Dog's Age: " + dogAge + " years old<br>" +
                "📅 Human Age: " + humanYears + " years old<br>" +
                "🎾 Random Toy: Toy #" + randomToy;
        }
    </script>

</body>
</html>
